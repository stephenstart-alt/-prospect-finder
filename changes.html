<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Changes — TopKnocker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0A0A0B;
  --bg-elevated: #111113;
  --bg-card: #161618;
  --border: #2A2A2E;
  --text: #F4F4F5;
  --text-secondary: #A1A1AA;
  --text-muted: #71717A;
  --accent: #3B82F6;
  --accent-glow: rgba(59,130,246,0.15);
  --hot: #EF4444;
  --warm: #10B981;
  --amber: #F59E0B;
  --purple: #8B5CF6;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'Outfit', -apple-system, sans-serif;
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* NAV */
nav { position: sticky; top: 0; z-index: 100; background: rgba(10,10,11,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 2rem; }
.nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
.nav-logo { font-family: var(--font-display); font-size: 1.3rem; color: var(--text); letter-spacing: -0.5px; text-decoration: none; }
.nav-logo span { color: var(--accent); }
.nav-back { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
.nav-back:hover { color: var(--text); }

/* LAYOUT */
.page { max-width: 1100px; margin: 0 auto; padding: 2rem; }

/* HEADER */
.page-header { margin-bottom: 2rem; }
.page-header h1 { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 0.3rem; }
.page-header p { color: var(--text-muted); font-size: 0.9rem; }

/* STATS BAR */
.stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1rem; text-align: center; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.stat-card.new::before { background: var(--accent); }
.stat-card.reduced::before { background: var(--amber); }
.stat-card.withdrawn::before { background: var(--purple); }
.stat-card.sold-stc::before { background: var(--hot); }
.stat-card.sold::before { background: var(--warm); }
.stat-num { font-size: 2rem; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
.stat-card.new .stat-num { color: var(--accent); }
.stat-card.reduced .stat-num { color: var(--amber); }
.stat-card.withdrawn .stat-num { color: var(--purple); }
.stat-card.sold-stc .stat-num { color: var(--hot); }
.stat-card.sold .stat-num { color: var(--warm); }
.stat-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 0.3rem; }

/* FILTERS */
.filters { display: flex; gap: 0.6rem; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
.filter-btn { padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-search { flex: 1; min-width: 200px; max-width: 300px; margin-left: auto; padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-family: var(--font-body); font-size: 0.8rem; outline: none; transition: border-color 0.2s; }
.filter-search:focus { border-color: var(--accent); }
.window-divider { width: 1px; height: 20px; background: var(--border); margin: 0 0.25rem; align-self: center; }
.window-btn { padding: 0.4rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: var(--font-body); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.window-btn:hover { border-color: var(--accent); color: var(--text); }
.window-btn.active { background: rgba(99,102,241,0.15); border-color: var(--accent); color: var(--accent); }
.filter-search::placeholder { color: var(--text-muted); }

/* SCAN DATE GROUP */
.scan-group { margin-bottom: 2.5rem; }
.scan-date-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.scan-date-header h2 { font-family: var(--font-display); font-size: 1.1rem; white-space: nowrap; }
.scan-date-header .line { flex: 1; height: 1px; background: var(--border); }
.scan-date-header .count { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; white-space: nowrap; }

/* CHANGE CARDS */
.changes-list { display: flex; flex-direction: column; gap: 0.5rem; }
.change-card { display: grid; grid-template-columns: 6rem 1fr auto; gap: 1rem; align-items: center; padding: 0.9rem 1.2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; transition: all 0.2s; border-left: 3px solid transparent; }
.change-card:hover { border-color: rgba(255,255,255,0.08); transform: translateX(2px); }
.change-card[data-type="new_listing"] { border-left-color: var(--accent); }
.change-card[data-type="price_reduced"] { border-left-color: var(--amber); }
.change-card[data-type="withdrawn"] { border-left-color: var(--purple); }
.change-card[data-type="sold_stc"] { border-left-color: var(--hot); }
.change-card[data-type="sold"] { border-left-color: var(--warm); }

.change-badge { padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
.change-card[data-type="new_listing"] .change-badge { background: rgba(59,130,246,0.12); color: var(--accent); }
.change-card[data-type="price_reduced"] .change-badge { background: rgba(245,158,11,0.12); color: var(--amber); }
.change-card[data-type="withdrawn"] .change-badge { background: rgba(139,92,246,0.12); color: var(--purple); }
.change-card[data-type="sold_stc"] .change-badge { background: rgba(239,68,68,0.12); color: var(--hot); }
.change-card[data-type="sold"] .change-badge { background: rgba(16,185,129,0.12); color: var(--warm); }

.change-info { min-width: 0; }
.change-address { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.change-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
.change-meta .agent { color: var(--text-secondary); }

.change-price { text-align: right; white-space: nowrap; }
.change-price .current { font-weight: 700; font-size: 0.95rem; }
.change-price .was { font-size: 0.75rem; color: var(--text-muted); text-decoration: line-through; }
.change-price .direction { font-size: 0.7rem; font-weight: 600; }
.change-price .direction.down { color: var(--amber); }

/* EMPTY / LOADING */
.loading, .empty { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
.loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }

/* ERROR */
.error-banner { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); border-radius: var(--radius); padding: 1rem 1.5rem; margin-bottom: 2rem; color: var(--hot); font-size: 0.85rem; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .change-card { grid-template-columns: 5.5rem 1fr; }
  .change-price { grid-column: 1 / -1; text-align: left; padding-left: 6.5rem; }
  .filters { flex-direction: column; align-items: stretch; }
  .filter-search { max-width: none; margin-left: 0; }
}
@media (max-width: 480px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .stat-card:last-child { grid-column: 1 / -1; }
  .page { padding: 1rem; }
  .change-card { grid-template-columns: 1fr; gap: 0.4rem; padding: 0.8rem 1rem; }
  .change-price { padding-left: 0; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">Top<span>Knocker</span></a>
    <a href="/" class="nav-back">← Back to dashboard</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1>Market Changes</h1>
    <p>Property listing changes detected by the weekly scanner</p>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-card new"><div class="stat-num" id="stat-new">—</div><div class="stat-label">New Listings</div></div>
    <div class="stat-card reduced"><div class="stat-num" id="stat-reduced">—</div><div class="stat-label">Price Reduced</div></div>
    <div class="stat-card withdrawn"><div class="stat-num" id="stat-withdrawn">—</div><div class="stat-label">Withdrawn</div></div>
    <div class="stat-card sold-stc"><div class="stat-num" id="stat-sold-stc">—</div><div class="stat-label">Sold STC</div></div>
    <div class="stat-card sold"><div class="stat-num" id="stat-sold">—</div><div class="stat-label">Sold</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="new_listing">New</button>
    <button class="filter-btn" data-filter="price_reduced">Reduced</button>
    <button class="filter-btn" data-filter="withdrawn">Withdrawn</button>
    <button class="filter-btn" data-filter="sold_stc">Sold STC</button>
    <button class="filter-btn" data-filter="sold">Sold</button>
    <div class="window-divider"></div>
    <button class="window-btn" data-days="7" onclick="setWindow(7)">7d</button>
    <button class="window-btn active" data-days="14" onclick="setWindow(14)">14d</button>
    <button class="window-btn" data-days="30" onclick="setWindow(30)">30d</button>
    <button class="window-btn" data-days="90" onclick="setWindow(90)">90d</button>
    <input type="text" class="filter-search" id="search" placeholder="Search address, postcode, agent…">
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Loading changes…</div>
  </div>
</div>

<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://yeogknaswgithbmpcozu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inllb2drbmFzd2dpdGhibXBjb3p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNzkxMzcsImV4cCI6MjA4NTg1NTEzN30.sS_76s17DLrd2NXyWwzCyolxH-kaomgANjsPZDyaAC8';

let allChanges = [];
let activeFilter = 'all';
let searchTerm = '';

// ── FETCH DATA ──
let windowDays = 14;

async function fetchChanges() {
  try {
    const since = new Date();
    since.setDate(since.getDate() - windowDays);
    const sinceStr = since.toISOString().split('T')[0];
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/listing_changes?select=*&scan_date=gte.${sinceStr}&order=scan_date.desc,detected_at.desc&limit=5000`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allChanges = await res.json();
    updateStats();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error-banner">Failed to load data: ${e.message}. Check Supabase connection.</div>`;
  }
}

function setWindow(days) {
  windowDays = days;
  document.querySelectorAll('.window-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.days) === days));
  fetchChanges();
}

// ── STATS ──
function updateStats() {
  const counts = { new_listing: 0, price_reduced: 0, withdrawn: 0, sold_stc: 0, sold: 0 };
  allChanges.forEach(c => { if (counts[c.change_type] !== undefined) counts[c.change_type]++; });
  document.getElementById('stat-new').textContent = counts.new_listing;
  document.getElementById('stat-reduced').textContent = counts.price_reduced;
  document.getElementById('stat-withdrawn').textContent = counts.withdrawn;
  document.getElementById('stat-sold-stc').textContent = counts.sold_stc;
  document.getElementById('stat-sold').textContent = counts.sold;
}

// ── RENDER ──
function render() {
  const content = document.getElementById('content');
  const filtered = allChanges.filter(c => {
    if (activeFilter !== 'all' && c.change_type !== activeFilter) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      const haystack = `${c.full_address || ''} ${c.house_number || ''} ${c.building_name || ''} ${c.street} ${c.postcode} ${c.town} ${c.agent}`.toLowerCase();
      if (!haystack.includes(s)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No changes found${activeFilter !== 'all' ? ' for this filter' : ''}${searchTerm ? ' matching your search' : ''}.</div>`;
    return;
  }

  // Group by scan_date
  const groups = {};
  filtered.forEach(c => {
    const date = c.scan_date || 'Unknown';
    if (!groups[date]) groups[date] = [];
    groups[date].push(c);
  });

  let html = '';
  for (const [date, changes] of Object.entries(groups)) {
    const d = new Date(date + 'T00:00:00');
    const formatted = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    html += `
      <div class="scan-group">
        <div class="scan-date-header">
          <h2>${formatted}</h2>
          <div class="line"></div>
          <div class="count">${changes.length} change${changes.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="changes-list">
          ${changes.map(c => renderCard(c)).join('')}
        </div>
      </div>`;
  }
  content.innerHTML = html;
}

function renderCard(c) {
  const labels = {
    new_listing: 'New Listing',
    price_reduced: 'Reduced',
    withdrawn: 'Withdrawn',
    sold_stc: 'Sold STC',
    sold: 'Sold'
  };

  // Build address, ensuring house_number is always included
  let streetPart;
  if (c.full_address) {
    // Check if full_address already starts with the house number
    const hn = c.house_number ? c.house_number.toString().trim() : '';
    const alreadyIncluded = hn && c.full_address.match(new RegExp('^' + hn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=[,\\s]|$)'));
    streetPart = (hn && !alreadyIncluded) ? hn + ', ' + c.full_address : c.full_address;
  } else {
    streetPart = [c.house_number, c.building_name, c.street].filter(Boolean).join(', ');
  }
  const address = [streetPart, c.postcode].filter(Boolean).join(', ');
  const badge = labels[c.change_type] || c.change_type;

  let priceHtml = '';
  if (c.change_type === 'price_reduced' && c.old_value && c.new_value) {
    const drop = (parseInt(c.old_value.replace(/[£,]/g, '')) || 0) - (parseInt(c.new_value.replace(/[£,]/g, '')) || 0);
    const pct = parseInt(c.old_value.replace(/[£,]/g, '')) > 0
      ? Math.round((drop / parseInt(c.old_value.replace(/[£,]/g, ''))) * 100) : 0;
    priceHtml = `
      <div class="change-price">
        <div class="current">${c.new_value}</div>
        <div class="was">${c.old_value}</div>
        <div class="direction down">▼ ${pct}% (${formatGBP(drop)})</div>
      </div>`;
  } else if (c.price) {
    priceHtml = `<div class="change-price"><div class="current">£${Number(c.price).toLocaleString()}</div></div>`;
  } else if (c.new_value && c.new_value.startsWith('£')) {
    priceHtml = `<div class="change-price"><div class="current">${c.new_value}</div></div>`;
  }

  return `
    <div class="change-card" data-type="${c.change_type}">
      <div class="change-badge">${badge}</div>
      <div class="change-info">
        <div class="change-address">${address || 'Unknown address'}</div>
        <div class="change-meta">
          ${c.agent ? `<span class="agent">${c.agent}</span>` : ''}
          ${c.town ? `<span>${c.town}</span>` : ''}
          ${c.change_type === 'withdrawn' || c.change_type === 'sold_stc' || c.change_type === 'sold'
            ? `<span>${c.new_value || ''}</span>` : ''}
        </div>
      </div>
      ${priceHtml}
    </div>`;
}

function formatGBP(n) {
  if (n >= 1000) return `£${(n / 1000).toFixed(0)}k`;
  return `£${n.toLocaleString()}`;
}

// ── FILTERS ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

// ── INIT ──
fetchChanges();
</script>
</body>
</html>
